<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>UMT Game Hub - School Gaming Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Pixel Game';
            src: url('/assets/font/Pixel Game.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            font-smooth: never;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale
        }

        @font-face {
            font-family: 'Pixel Game Extrude';
            src: url('/assets/font/Pixel Game Extrude.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            font-smooth: never;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #5c94fc;
            /* Super Mario Sky Blue */
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Video Background */
        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        .video-background {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%) scale(1.5);
            pointer-events: none;
        }

        .video-background iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 30px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 20px;
            color: white;
            text-shadow: 3px 3px 0px #000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 24px;
        }

        /* Main Section */
        .main-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 200px 20px 100px;
            text-align: center;
        }

        /* Pixel-style RPG Dialog Panel - Using custom wooden frame */
        .content-panel {
            border: none;
            padding: 100px 60px;
            /* Large padding to fit content inside */
            max-width: 700px;
            min-height: 300px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Wooden frame background */
        .content-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('/ui-board.png') center/100% 100% no-repeat;
            z-index: -2;
        }

        /* ========================================
           KHUNG KEM - CÁC THÔNG SỐ CÓ THỂ CHỈNH:
           - top: khoảng cách từ viền trên
           - bottom: khoảng cách từ viền dưới  
           - left: khoảng cách từ viền trái
           - right: khoảng cách từ viền phải
           - background-color: rgba(R, G, B, opacity)
             + opacity: 0.0 (trong suốt) -> 1.0 (đục hoàn toàn)
           ======================================== */
        .content-panel::after {
            content: '';
            position: absolute;
            top: 90px;
            /* 👈 CHỈNH: Viền trên */
            left: 25px;
            /* 👈 CHỈNH: Viền trái */
            right: 30px;
            /* 👈 CHỈNH: Viền phải */
            bottom: 80px;
            /* 👈 CHỈNH: Viền dưới */
            background-color: rgba(139, 90, 43, 0.5);
            /* 👈 CHỈNH: Màu và độ trong suốt */
            border-radius: 4px;
            z-index: -3;
            /* Nằm DƯỚI khung board */
        }

        .title-wrapper {
            position: relative;
            margin-top: 30px;
            margin-bottom: 0px;
            animation: bounceTitle 0.6s ease-out;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .title-extrude {
            font-family: 'Pixel Game Extrude', 'Press Start 2P', cursive;
            font-size: 128px;
            font-weight: 400;
            color: #25343F;
            /* Dark Blue-Grey for extrude/shadow */
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            letter-spacing: 4px;
            white-space: nowrap;
            font-smooth: never;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .title {
            font-family: 'Pixel Game', 'Press Start 2P', cursive;
            font-size: 128px;
            font-weight: 400;
            /* Custom Gradient: #FFEF5F (Yellow) -> #F16D34 (Red-Orange) */
            background: linear-gradient(180deg, #FFEF5F 0%, #F16D34 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
            z-index: 2;
            letter-spacing: 4px;
            white-space: nowrap;
            font-smooth: never;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            text-shadow: none;
            /* Gradient text shouldn't have shadow, the Extrude layer handles depth */
            margin: 0;
            animation: none;
            /* Animation moved to wrapper */
        }

        @keyframes bounceTitle {
            0% {
                opacity: 0;
                transform: translateY(-50px);
            }

            60% {
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 16px;
            color: #ffe4c4;
            /* Màu kem */
            text-shadow: 2px 2px 0px #000;
            /* Bóng đen để dễ đọc */
            margin-bottom: 20px;
            /* 👈 Giảm khoảng cách với button */
            line-height: 1.5;
            max-width: 600px;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 20px 40px;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            border: 4px solid #000;
            cursor: pointer;
            transition: all 0.1s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 4px 4px 0px #000;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        /* Custom JOIN ROOM Button */
        .btn-join-room {
            display: block;
            cursor: pointer;
            position: relative;
        }

        /* Shadow image - fixed position, black */
        .btn-join-room .btn-shadow {
            height: 100px;
            width: auto;
            filter: brightness(0);
            position: absolute;
            top: 4px;
            left: 4px;
        }

        /* Main button image */
        .btn-join-room .btn-main {
            height: 100px;
            width: auto;
            position: relative;
            transition: transform 0.1s;
        }

        .btn-join-room:active .btn-main {
            transform: translate(4px, 4px);
        }

        .btn-join-room:hover .btn-main {
            filter: brightness(1.1);
        }

        /* Admin Icon Button (Top-Right) - Using pre-made pixel circle icon */
        .btn-admin-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: transparent;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 200;
            filter: drop-shadow(4px 4px 0px #000);
            transition: all 0.1s;
        }

        .btn-admin-icon:active {
            transform: translate(4px, 4px);
            filter: none;
        }

        .btn-admin-icon img {
            width: 45px;
            height: 45px;
        }



        /* Password Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #5c94fc;
            padding: 40px;
            border: 8px solid #000;
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: modalBounce 0.3s ease;
        }

        @keyframes modalBounce {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content h2 {
            color: white;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .modal-content p {
            color: white;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 25px;
            font-size: 10px;
            line-height: 1.8;
        }

        .modal-content input {
            width: 100%;
            padding: 15px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            border: 4px solid #000;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #ffc107;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 15px 25px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            border: 4px solid #000;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        .modal-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #000;
        }

        .modal-btn-confirm {
            background: #228b22;
            color: white;
        }

        .modal-btn-cancel {
            background: #dc3545;
            color: white;
        }

        .error {
            color: #ff6b6b;
            font-size: 10px;
            margin-bottom: 15px;
            display: none;
            text-shadow: 1px 1px 0px #000;
        }

        .error.show {
            display: block;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {

            .title,
            .title-extrude {
                font-size: 72px;
            }

            .subtitle {
                font-size: 10px;
            }

            .btn {
                padding: 15px 25px;
                font-size: 10px;
            }

            .buttons-container {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .question-block-1 {
                left: 5%;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 14px;
            }

            .title,
            .title-extrude {
                font-size: 56px;
            }
        }
    </style>
</head>

<body>
    <!-- Video Background -->
    <div class="video-wrapper">
        <div class="video-background">
            <div id="player"></div>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <span class="logo">
            <img src="/logo-umt-new.png" alt="UMT Logo" class="logo-icon" style="height: 30px; width: auto;">
        </span>
    </div>

    <!-- Admin Icon Button -->
    <button class="btn-admin-icon" onclick="showPasswordModal()" title="Admin Access">
        <img src="/admin-icon-pixel.png" alt="Admin">
    </button>

    <!-- Main Content -->
    <div class="main-content">
        <div class="content-panel">
            <div class="title-wrapper">
                <span class="title-extrude">GAME HUB</span>
                <h1 class="title">GAME HUB</h1>
            </div>
            <p class="subtitle">
                UMT's realtime gaming platform.<br>
                Learn while you play, play while you learn!
            </p>

            <div class="buttons-container">
                <a href="/player.html" class="btn-join-room">
                    <img src="/btn-join-now.png" alt="" class="btn-shadow">
                    <img src="/btn-join-now.png" alt="JOIN ROOM" class="btn-main">
                </a>
            </div>
        </div>
    </div>

    <!-- Password Modal -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h2>🔒 ADMIN ACCESS</h2>
            <p>Enter password to access host controls</p>

            <div class="error" id="errorMsg">❌ Wrong password!</div>

            <input type="password" id="passwordInput" placeholder="Password..." onkeypress="handleKeyPress(event)">

            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closePasswordModal()">
                    Cancel
                </button>
                <button class="modal-btn modal-btn-confirm" onclick="verifyPassword()">
                    Enter
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. YouTube IFrame API Code
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var loopStart = 18;
        var loopEnd = 90; // 1:30

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: '2AaQtoNxRB0',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'loop': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'mute': 1, // Start muted for autoplay
                    'start': loopStart,
                    'end': loopEnd,
                    'playlist': '2AaQtoNxRB0'
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.mute();
            event.target.playVideo();

            // Unmute on first interaction
            const unmuteFn = function () {
                if (player) {
                    player.unMute();
                    if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        player.playVideo();
                    }
                }
                // Remove listeners
                document.body.removeEventListener('click', unmuteFn);
                document.body.removeEventListener('touchstart', unmuteFn);
                document.body.removeEventListener('keydown', unmuteFn);
            };

            document.body.addEventListener('click', unmuteFn);
            document.body.addEventListener('touchstart', unmuteFn);
            document.body.addEventListener('keydown', unmuteFn);
        }

        function onPlayerStateChange(event) {
            // When video ends (state 0) or playlists loop, we want to enforce OUR start time
            if (event.data === YT.PlayerState.ENDED) {
                player.seekTo(loopStart);
                player.playVideo();
            }
        }

        // Strict loop enforcement interval (in case 'end' parameter is ignored in loops)
        setInterval(function () {
            if (player && player.getCurrentTime) {
                if (player.getCurrentTime() >= loopEnd) {
                    player.seekTo(loopStart);
                    player.playVideo();
                }
            }
        }, 1000);

        // 2. Existing Modal & Password Logic
        function showPasswordModal() {
            const modal = document.getElementById('passwordModal');
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('errorMsg');

            modal.classList.add('active');
            error.classList.remove('show');
            input.value = '';

            setTimeout(() => input.focus(), 100);
        }

        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            modal.classList.remove('active');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                verifyPassword();
            }
        }

        async function verifyPassword() {
            const password = document.getElementById('passwordInput').value;
            const error = document.getElementById('errorMsg');

            if (!password) {
                error.textContent = '❌ Please enter password!';
                error.classList.add('show');
                return;
            }

            try {
                const response = await fetch('/verify-host-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('hostAuth', 'true');
                    window.location.href = '/host.html';
                } else {
                    error.textContent = '❌ Wrong password!';
                    error.classList.add('show');
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').focus();
                }
            } catch (err) {
                error.textContent = '❌ Connection error!';
                error.classList.add('show');
            }
        }

        // Close modal when clicking outside
        document.getElementById('passwordModal').addEventListener('click', (e) => {
            if (e.target.id === 'passwordModal') {
                closePasswordModal();
            }
        });
    </script>
</body>

</html>
