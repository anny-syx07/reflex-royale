<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player - Reflex Royale</title>
    <!-- Google Fonts - Press Start 2P for pixel style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #5c94fc;
            /* Super Mario Sky Blue */
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Clouds */
        .clouds-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            width: 96px;
            height: 48px;
            animation: floatCloud linear infinite;
        }

        .cloud-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 96px;
            height: 32px;
            background: white;
            border: 2px solid #333;
            border-radius: 9999px;
        }

        .cloud-top-left {
            position: absolute;
            top: 0;
            left: 25%;
            width: 48px;
            height: 40px;
            background: white;
            border: 2px solid #333;
            border-radius: 9999px;
        }

        .cloud-top-right {
            position: absolute;
            top: 8px;
            right: 0;
            width: 40px;
            height: 32px;
            background: white;
            border: 2px solid #333;
            border-radius: 9999px;
        }

        .cloud-fill {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 30px;
            background: white;
            z-index: 1;
        }

        .cloud-1 {
            top: 8%;
            left: -120px;
            animation-duration: 35s;
        }

        .cloud-2 {
            top: 20%;
            left: -120px;
            animation-duration: 45s;
            animation-delay: 8s;
            transform: scale(1.2);
        }

        .cloud-3 {
            top: 12%;
            left: -120px;
            animation-duration: 40s;
            animation-delay: 20s;
            transform: scale(0.8);
        }

        @keyframes floatCloud {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(calc(100vw + 200px));
            }
        }

        /* Ground */
        .ground-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 5;
        }

        .ground-top {
            height: 40px;
            background: #8b5a2b;
            border-top: 8px solid #228b22;
        }

        .ground-bottom {
            height: 80px;
            background: repeating-linear-gradient(90deg,
                    #cd853f 0px,
                    #cd853f 40px,
                    #8b4513 40px,
                    #8b4513 80px);
        }

        /* Platforms */
        .platform {
            position: fixed;
            z-index: 6;
        }

        .platform-block {
            width: 40px;
            height: 40px;
            background: #cd853f;
            border: 4px solid #8b4513;
            display: inline-block;
        }

        .platform-1 {
            bottom: 120px;
            right: 10%;
        }

        .platform-2 {
            bottom: 200px;
            left: 5%;
        }

        /* Question Blocks */
        .question-block {
            width: 40px;
            height: 40px;
            background: #ffc107;
            border: 4px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            animation: blockBounce 1s ease-in-out infinite;
            position: fixed;
            z-index: 7;
        }

        .question-block-1 {
            bottom: 250px;
            left: 15%;
        }

        .question-block-2 {
            bottom: 160px;
            right: 8%;
        }

        @keyframes blockBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* Mario Sprite Animation */
        .mario {
            position: fixed;
            bottom: 125px;
            width: 35px;
            height: 47px;
            background-image: url('/mario_spritesheet.png');
            background-repeat: no-repeat;
            image-rendering: pixelated;
            z-index: 8;
            animation: runMario 12s linear infinite, marioSprite 0.5s steps(8) infinite;
        }

        @keyframes marioSprite {
            from {
                background-position: 0 0;
            }

            to {
                background-position: -280px 0;
            }
        }

        @keyframes runMario {
            0% {
                left: -50px;
                transform: scaleX(1);
            }

            49% {
                left: calc(100% + 50px);
                transform: scaleX(1);
            }

            50% {
                left: calc(100% + 50px);
                transform: scaleX(-1);
            }

            99% {
                left: -50px;
                transform: scaleX(-1);
            }

            100% {
                left: -50px;
                transform: scaleX(1);
            }
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px 20px 200px;
            text-align: center;
        }

        /* Join Screen - Pixel Style Panel */
        #joinScreen {
            background: #e8d4a8;
            border: 8px solid #8b4513;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 8px 8px 0px #000;
            position: relative;
        }

        /* Pixel corner decorations */
        #joinScreen::before,
        #joinScreen::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ffc107;
            border: 4px solid #000;
        }

        #joinScreen::before {
            top: -12px;
            left: -12px;
        }

        #joinScreen::after {
            top: -12px;
            right: -12px;
        }

        h1 {
            color: #5a3a2a;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .subtitle {
            color: #fff;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 30px;
            font-size: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 14px;
            font-family: 'Press Start 2P', cursive;
            border: 4px solid #000;
            border-radius: 0;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #ffc107;
            background: #fffde7;
        }

        input::placeholder {
            color: #999;
            font-size: 10px;
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 14px;
            font-family: 'Press Start 2P', cursive;
            font-weight: bold;
            border: 4px solid #000;
            border-radius: 0;
            background: #228b22;
            color: white;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease;
        }

        button:hover {
            background: #2e8b57;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .error {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 10px;
            text-shadow: 1px 1px 0px #000;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            h1 {
                font-size: 16px;
            }

            .subtitle {
                font-size: 8px;
            }

            input {
                font-size: 12px;
                padding: 12px;
            }

            button {
                font-size: 12px;
                padding: 15px;
            }

            .question-block-1 {
                left: 5%;
            }
        }
    </style>
</head>

<body>
    <!-- Clouds -->
    <div class="clouds-container">
        <div class="cloud cloud-1">
            <div class="cloud-top-left"></div>
            <div class="cloud-top-right"></div>
            <div class="cloud-bottom"></div>
            <div class="cloud-fill"></div>
        </div>
        <div class="cloud cloud-2">
            <div class="cloud-top-left"></div>
            <div class="cloud-top-right"></div>
            <div class="cloud-bottom"></div>
            <div class="cloud-fill"></div>
        </div>
        <div class="cloud cloud-3">
            <div class="cloud-top-left"></div>
            <div class="cloud-top-right"></div>
            <div class="cloud-bottom"></div>
            <div class="cloud-fill"></div>
        </div>
    </div>

    <!-- Question Blocks -->
    <div class="question-block question-block-1">?</div>
    <div class="question-block question-block-2">?</div>

    <!-- Platforms -->
    <div class="platform platform-1">
        <div class="platform-block"></div>
        <div class="platform-block"></div>
        <div class="platform-block"></div>
    </div>
    <div class="platform platform-2">
        <div class="platform-block"></div>
        <div class="platform-block"></div>
    </div>

    <!-- Mario -->
    <div class="mario"></div>

    <!-- Ground -->
    <div class="ground-container">
        <div class="ground-top"></div>
        <div class="ground-bottom"></div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div id="joinScreen">
            <div id="step1">
                <h1>🎮 THAM GIA PHÒNG</h1>
                <p class="subtitle">Nhập mã phòng để chơi</p>
                <input type="text" id="roomCode" placeholder="Mã 4 số" maxlength="4">
                <button onclick="nextStep()">TIẾP TỤC ▶</button>
            </div>

            <div id="step2" style="display: none;">
                <h1>👤 TÊN CỦA BẠN</h1>
                <p class="subtitle">Nhập tên để mọi người biết bạn là ai</p>
                <input type="text" id="nickname" placeholder="Tên hiển thị">
                <button onclick="joinRoom()">VÀO GAME 🚀</button>
                <button onclick="prevStep()"
                    style="margin-top: 10px; background: #666; font-size: 10px; padding: 10px;">⬅ QUAY LẠI</button>
            </div>

            <p id="error" class="error"></p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoomCode = '';

        // Check URL params on load (QR Code scan)
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('roomCode');
            if (code) {
                currentRoomCode = code;
                document.getElementById('roomCode').value = code;
                // Auto skip to step 2
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            }
        };

        function nextStep() {
            const codeInput = document.getElementById('roomCode').value.trim().toUpperCase();
            const errorEl = document.getElementById('error');

            if (codeInput.length < 4) {
                errorEl.textContent = 'Mã phòng phải có 4 ký tự!';
                return;
            }

            currentRoomCode = codeInput;
            errorEl.textContent = '';

            // Switch to step 2
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('nickname').focus();
        }

        function prevStep() {
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('error').textContent = '';
        }

        function joinRoom() {
            const roomCode = currentRoomCode || document.getElementById('roomCode').value.trim().toUpperCase();
            const nickname = document.getElementById('nickname').value.trim() || 'Player';
            const errorEl = document.getElementById('error');

            if (!roomCode) {
                errorEl.textContent = 'Vui lòng nhập mã phòng!';
                document.getElementById('step1').style.display = 'block';
                document.getElementById('step2').style.display = 'none';
                return;
            }

            if (!nickname) {
                errorEl.textContent = 'Vui lòng nhập tên!';
                return;
            }

            errorEl.textContent = 'Đang kết nối...';

            // Check room mode
            socket.emit('checkRoomMode', { roomCode }, (response) => {
                if (response.error) {
                    errorEl.textContent = response.error;
                    // Provide option to go back if room code invalid
                    if (response.error.includes('không tồn tại')) {
                        setTimeout(() => {
                            if (confirm('Mã phòng không đúng, bạn có muốn nhập lại?')) {
                                prevStep();
                            }
                        }, 1000);
                    }
                    return;
                }

                // Redirect to appropriate game page with params
                const params = new URLSearchParams({
                    roomCode,
                    nickname
                });

                let targetPage;
                if (response.gameMode === 'CONQUEST') {
                    targetPage = '/conquest-player.html';
                } else {
                    targetPage = '/player-reflex.html';
                }

                window.location.href = `${targetPage}?${params.toString()}`;
            });
        }

        // Allow Enter key
        document.getElementById('roomCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') nextStep();
        });
        document.getElementById('nickname').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });
    </script>
</body>

</html>
