<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Royale - Host</title>
    <style>
        @font-face {
            font-family: 'Pixel Game';
            src: url('/assets/font/Pixel Game.otf') format('opentype');
        }

        @font-face {
            font-family: 'Pixel Game Extrude';
            src: url('/assets/font/Pixel Game Extrude.otf') format('opentype');
        }

        @font-face {
            font-family: 'KVN';
            src: url('/assets/font/kvn-97.ttf') format('truetype');
        }

        @font-face {
            font-family: 'SVN-Determination Sans';
            src: url('/assets/font/SVN-Determination Sans.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Sky gradient background */
            background: linear-gradient(180deg, #4A90D9 0%, #87CEEB 50%, #E0F6FF 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Animated decorative halftone pattern overlay */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.15) 2px, transparent 2px),
                radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px, 30px 30px;
            background-position: 0 0, 25px 25px;
            pointer-events: none;
            z-index: 1;
            animation: slidePattern 60s linear infinite;
        }

        @keyframes slidePattern {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(50px, 50px) rotate(5deg);
            }
        }

        /* UMT Campus Foreground - Background layer */
        .campus-foreground {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/images/umt-campus-bg.png') center bottom/cover no-repeat;
            z-index: 2;
            pointer-events: none;
        }

        /* Blur Overlay Animation */
        @keyframes blurSlide {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 100% 0;
            }
        }

        /* Blur Overlay - covers entire background */
        .blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/images/blur-overlay.png') 0 0/90% 90% repeat;
            z-index: 3;
            pointer-events: none;
            opacity: 0.7;
            animation: blurSlide 9s linear infinite;
        }

        /* Main Container - above foreground */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* UI Board Frame Container */
        .board-frame {
            position: relative;
            max-width: 600px;
            width: 90%;
            /* Padding defines the safe area for inner board: Top Right Bottom Left */
            padding: 80px 40px 90px 35px;
            transform: scale(2);
            /* Permanent scale */
            transform-origin: center;
            animation: slideUpFade 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Enhanced entrance animation */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1.25);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating pixel particles */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.3) 3px, transparent 3px),
                radial-gradient(circle, rgba(255, 255, 255, 0.2) 2px, transparent 2px),
                radial-gradient(circle, rgba(255, 255, 255, 0.15) 2px, transparent 2px);
            background-size: 200px 200px, 150px 150px, 100px 100px;
            background-position: 0 0, 50px 50px, 100px 25px;
            pointer-events: none;
            z-index: 3;
            animation: floatPixels 20s ease-in-out infinite;
            opacity: 0.4;
        }

        @keyframes floatPixels {

            0%,
            100% {
                transform: translateY(0) translateX(0);
            }

            25% {
                transform: translateY(-20px) translateX(10px);
            }

            50% {
                transform: translateY(-10px) translateX(-15px);
            }

            75% {
                transform: translateY(-30px) translateX(5px);
            }
        }

        /* UI Board Frame - rendered ABOVE board-inner using pseudo-element */
        .board-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/ui-board.png') center center /contain no-repeat;
            z-index: 2;
            pointer-events: none;
        }

        /* Dark teal transparent overlay with blur - BELOW the frame */
        .board-inner {
            position: relative;
            z-index: 1;
            background: rgba(139, 90, 43, 0.5);
            backdrop-filter: blur(5px) saturate(150%);
            -webkit-backdrop-filter: blur(5px) saturate(150%);
            padding: 20px 30px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow:
                0 8px 32px 0 rgba(31, 38, 135, 0.37),
                inset 0 0 0 1px rgba(255, 255, 255, 0.18);
        }

        /* Content Inside Board */
        .board-content {
            text-align: center;
            padding: 10px;
        }

        .content-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            /* Reduced from 50px */
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        .content-wrapper.has-selection {
            justify-content: center;
            /* Keep centered or uses flex-start if needed */
            /* transform: translateX(-40px); REMOVED to prevent shift */
        }

        h1 {
            position: relative;
            font-size: 48px;
            margin-bottom: 10px;
            margin-top: -30px;
            font-weight: normal;
            letter-spacing: 4px;
            z-index: 15;
            text-align: left;
            padding-left: 30px;
        }

        /* Layered text effect - Extrude background */
        h1::before {
            content: 'SELECT MODE';
            position: absolute;
            top: 0;
            left: 30px;
            font-family: 'Pixel Game Extrude', sans-serif;
            color: #000;
            z-index: 1;
        }

        /* Main text foreground */
        h1::after {
            content: 'SELECT MODE';
            position: absolute;
            top: 0;
            left: 30px;
            font-family: 'Pixel Game', sans-serif;
            color: #FFD700;
            z-index: 2;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 40px;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-weight: 500;
        }

        /* Game Selection Grid */
        .game-selection {
            display: flex;
            gap: 30px;
            /* Reduced from 100px */
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
        }

        /* Game Icon Cards */
        .game-card {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Bordered frame wrapper */
        .game-card-frame {
            position: relative;
            width: 120px;
            height: 120px;
            border: 4px solid transparent;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Colored borders for each game */
        #reflexCard .game-card-frame {
            border-color: #F5F5DC;
            background-color: #F5F5DC;
            /* Fill background */
        }

        #conquestCard .game-card-frame {
            border-color: #F5F5DC;
            background-color: #F5F5DC;
            /* Fill background */
        }





        .game-card img {
            width: 100%;
            height: 100%;
            border-radius: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: none;
            image-rendering: pixelated;
        }



        /* Black box container for text */
        .game-name {
            position: relative;
            width: 120px;
            height: 0;
            background: #F5F5DC;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'SVN-Determination Sans', 'KVN', sans-serif;
            font-size: 16px;
            color: #333333;
            text-shadow: none;
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .game-card.selected .game-name {
            height: 60px;
            opacity: 1;
        }

        /* Start Button */
        .btn {
            display: inline-block;
            width: 0;
            max-width: 0;
            height: 56px;
            border: none;
            cursor: pointer;
            background: none;
            /* Removed background image */
            font-size: 0;
            position: relative;
            /* filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4)); Removed drop-shadow */
            opacity: 0;
            visibility: hidden;
            transform: translateX(30px) scale(0.8);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            overflow: hidden;
        }

        .btn.show {
            width: 200px;
            max-width: 200px;
            opacity: 1;
            visibility: visible;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        .btn::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            filter: blur(6px);
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .btn:hover::before {
            width: 85%;
            opacity: 0.5;
        }

        .btn:active:not(:disabled) .btn-main {
            transform: translate(4px, 4px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* Shadow Layer - Absolute to not affect layout */
        .btn-shadow {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0) opacity(0.5);
            z-index: 1;
        }

        /* Main Image Layer - Absolute to not affect layout */
        .btn-main {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
            transition: transform 0.1s;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .board-frame {
                padding: 30px 20px;
                width: 95%;
            }

            .board-inner {
                padding: 30px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
                margin-bottom: 30px;
            }

            .game-card img {
                width: 80px;
                height: 80px;
            }

            .btn {
                font-size: 18px;
                padding: 16px 40px;
            }

            .game-selection {
                gap: 25px;
            }
        }
    </style>
</head>

<body>
    <!-- UMT Campus Foreground Image -->
    <div class="campus-foreground"></div>

    <!-- Blur Overlay covering entire background -->
    <div class="blur-overlay"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- UI Board Frame -->
        <div class="board-frame">
            <h1 style="color: transparent;">SELECT MODE</h1>

            <!-- Dark teal transparent overlay with blur -->
            <div class="board-inner">
                <div class="board-content">
                    <div class="content-wrapper">
                        <div class="game-selection">
                            <div class="game-card" id="reflexCard" onclick="selectGame('reflex')">
                                <div class="game-card-frame">
                                    <img src="/images/reflex-icon.png" alt="Phản Xạ Cực Nhanh">
                                </div>
                                <div class="game-name">Phản Xạ<br>Cực Nhanh</div>
                            </div>

                            <div class="game-card" id="conquestCard" onclick="selectGame('conquest')">
                                <div class="game-card-frame">
                                    <img src="/images/conquest-icon.png" alt="Đại Chiến Giảng Đường">
                                </div>
                                <div class="game-name">Đại Chiến<br>Giảng Đường</div>
                            </div>
                        </div>

                        <button class="btn" id="startBtn" disabled onclick="startGame()">
                            <img src="/images/btn-start.png" class="btn-shadow" alt="">
                            <img src="/images/btn-start.png" class="btn-main" alt="Start">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedGameMode = null;

        function selectGame(mode) {
            selectedGameMode = mode;

            // Update UI - remove selected from all cards
            document.querySelectorAll('.game-card').forEach(card => {
                card.classList.remove('selected');
            });

            // Add selected to clicked card
            if (mode === 'reflex') {
                document.getElementById('reflexCard').classList.add('selected');
            } else {
                document.getElementById('conquestCard').classList.add('selected');
            }

            // Add animation: shift wrapper left
            document.querySelector('.content-wrapper').classList.add('has-selection');

            // Show and enable button with animation
            const btn = document.getElementById('startBtn');
            btn.classList.add('show');
            btn.disabled = false;

            if (mode === 'reflex') {
                // btn.textContent = '⚡ Tạo Phòng Phản Xạ Cực Nhanh';
                btn.title = 'Tạo Phòng Phản Xạ Cực Nhanh';
            } else {
                // btn.textContent = '🏛️ Tạo Phòng Đại Chiến Giảng Đường';
                btn.title = 'Tạo Phòng Đại Chiến Giảng Đường';
            }
        }

        function startGame() {
            if (!selectedGameMode) return;

            if (selectedGameMode === 'reflex') {
                window.location.href = '/host-reflex.html';
            } else {
                window.location.href = '/conquest-host.html';
            }
        }
    </script>
</body>

</html>
